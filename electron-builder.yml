appId: com.jinvu.genassetstudio
productName: Gen Asset Studio
copyright: Copyright © Jin Vũ
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources/style-templates
    to: style-templates
  - from: resources/sample-project
    to: sample-project
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: GenAssetStudio-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Gen Asset Studio
  uninstallDisplayName: Gen Asset Studio
portable:
  artifactName: GenAssetStudio-Portable-${version}.${ext}
  unpackDirName: GenAssetStudio
npmRebuild: false
publish:
  provider: github
  owner: doanvu2000
  repo: Gen-Asset-Studio
  releaseType: release
